<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Left leg gradient: Elegant purple to royal indigo -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <!-- Right leg gradient: Bright cyan to neon blue -->
    <linearGradient id="cyan-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Subtle glow filter to give it that premium neon/tech vibe -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left leg of the V: curves down-right elegantly -->
  <path d="M28,28 C32,44 40,62 48,72" 
        fill="none" 
        stroke="url(#purple-grad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Right leg of the V: loops from bottom, curves up-right elegantly -->
  <path d="M48,72 C54,62 64,44 70,32" 
        fill="none" 
        stroke="url(#cyan-grad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- The distinctive glowing cyan dot at the top-right terminal of the V -->
  <circle cx="76" cy="27" r="5" fill="#22d3ee" filter="url(#neon-glow)" />
</svg>
